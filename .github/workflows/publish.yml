name: Publish

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Run CI
    if: github.event.created || github.event.forced
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GOT_CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo

      - name: Check version consistency
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "${TAG#v}" != "${VERSION}" ]; then
            echo "::error::git tag and Cargo.toml versions don't match"
            exit 1
          fi

      - name: Authenticate with crates.io
        if: env.GOT_CRATES_IO_TOKEN == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: >-
            ${{ secrets.CRATES_IO_TOKEN || steps.auth.outputs.token }}
        run: cargo publish
