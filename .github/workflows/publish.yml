name: Publish

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Run CI
    if: github.event.created
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GOT_CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo

      - name: Check version consistency
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "${TAG#v}" != "${VERSION}" ]; then
            echo "::error::git tag and Cargo.toml versions don't match"
            exit 1
          fi

      - name: Authenticate with crates.io
        if: env.GOT_CRATES_IO_TOKEN == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: >-
            ${{ secrets.CRATES_IO_TOKEN || steps.auth.outputs.token }}
        run: cargo publish
