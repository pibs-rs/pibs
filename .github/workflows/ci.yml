name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo

      - name: Check compilation with default features
        run: cargo check --all-targets

      - name: Check compilation without default features
        run: cargo check --all-targets --no-default-features

      - name: Check compilation with all features
        run: cargo check --all-targets --all-features

      - name: Check compilation with MSRV
        run: |
          MSRV=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')
          rustup toolchain install "${MSRV}" --profile minimal --no-self-update
          cargo "+${MSRV}" check --all-targets --all-features

      - name: Run tests with default features
        run: cargo test

      - name: Run tests without default features
        run: cargo test --no-default-features

      - name: Run tests with all features
        run: cargo test --all-features

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy with default features
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Clippy without default features
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Run Clippy with all features
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build documentation with default features
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps

      - name: Build documentation without default features
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --no-default-features

      - name: Build documentation with all features
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features

      - name: Check packaging
        run: cargo package
